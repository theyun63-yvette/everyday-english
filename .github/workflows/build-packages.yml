name: Build multi-platform packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build packages
        run: python3 scripts/build_packages.py
      - name: Validate packages
        run: python3 scripts/validate_packages.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: everyday-english-packages
          path: dist/*
      - name: Attach packages to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
